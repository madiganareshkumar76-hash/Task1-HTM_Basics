<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Twitter Login</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #e6ecf0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .login-box {
      background: #fff;
      width: 360px;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.12);
      text-align: center;
    }

    .logo {
      width: 48px;
      margin-bottom: 16px;
    }

    h1 {
      margin: 0 0 24px;
      font-size: 28px;
      color: #1da1f2;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      margin-bottom: 14px;
      border: 1px solid #ccd6dd;
      border-radius: 8px;
      font-size: 14px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 999px;
      background: #1da1f2;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #1991da;
    }

    .links {
      margin-top: 14px;
      font-size: 14px;
    }

    .links a {
      color: #1da1f2;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <img class="logo" src="https://abs.twimg.com/icons/apple-touch-icon-192x192.png" alt="Twitter logo">
    <h1>Log in to Twitter</h1>
    <form>
      <input type="text" placeholder="Phone, email, or username" required>
      <input type="password" placeholder="Password" required>
      <button type="submit">Log In</button>
    </form>
    <div class="links">
      <a href="#">Forgot password?</a>
    </div>
  </div>
</body>
</html>
